[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visao-tinker-bell"
version = "8.0.0"
description = "Evidence-first forensic intelligence runtime for Brazilian public records and civic audit"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "python-dateutil>=2.8",
  "networkx>=3.0",
  "duckdb>=0.9",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
documents = ["pymupdf>=1.24"]

[project.scripts]
vtb = "vtb.cli:main"

[tool.setuptools.packages.find]
include = ["vtb*"]
exclude = ["lib*", "cases*", "rules*", "config*", "assets*", "schemas*", "huggingface*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
