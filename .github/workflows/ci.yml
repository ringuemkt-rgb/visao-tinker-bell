name: VTB CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vtb lib scripts
      - name: Ruff
        run: ruff check vtb tests
      - name: Tests
        run: pytest
      - name: CLI smoke
        run: |
          vtb --db /tmp/vtb.sqlite3 mission-init smoke "Smoke test" "A fonte suporta o claim?"
          vtb --db /tmp/vtb.sqlite3 mission-status smoke
          vtb source-health 403 | grep SOURCE_DEGRADED_NO_ABSENCE_INFERENCE
